[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = -<DesignTest.cpp> +<*>

monitor_speed = 115200
monitor_filters = time

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.filesystem = littlefs
build_src_filter = -<DesignTest.cpp> +<*>

monitor_speed = 115200
monitor_filters = time

lib_deps =
    zinggjm/GxEPD2
    adafruit/Adafruit GFX Library

[env:design_test]
extends = env:xiao_esp32s3
build_src_filter =
    -<*>
    +<DesignTest.cpp>
